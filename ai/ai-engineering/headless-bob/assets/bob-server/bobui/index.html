<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bobserver Demo</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --border: #2a2d3a;
      --ink: #e8eaf0;
      --muted: #7a7f99;
      --accent: #4f8ef7;
      --accent-dim: #1e3a6e;
      --green: #3dd68c;
      --green-dim: #0d3326;
      --red: #f76f6f;
      --red-dim: #3a1a1a;
      --yellow: #f7c948;
      --yellow-dim: #3a2f0a;
      --radius: 8px;
      --mono: "JetBrains Mono", "Fira Mono", "Cascadia Code", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ───────────────────────────────────────────── */
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
    header h1 span { color: var(--accent); }
    .server-row { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .server-row input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--ink);
      padding: 5px 10px;
      width: 240px;
      font-size: 13px;
    }
    .server-row input:focus { outline: none; border-color: var(--accent); }
    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    #status-dot.ok { background: var(--green); }
    #status-dot.err { background: var(--red); }

    /* ── Auth bar ─────────────────────────────────────────── */
    .auth-bar {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .auth-bar label { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .auth-bar input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--ink);
      padding: 4px 8px;
      font-size: 13px;
      width: 130px;
    }
    .auth-bar input:focus { outline: none; border-color: var(--accent); }

    /* ── Tabs ─────────────────────────────────────────────── */
    .tabs {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 2px;
      padding: 0 20px;
      flex-shrink: 0;
    }
    .tab {
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 14px 8px;
      transition: color .15s;
    }
    .tab:hover { color: var(--ink); }
    .tab.active { border-bottom-color: var(--accent); color: var(--accent); }

    /* ── Main layout ──────────────────────────────────────── */
    main {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .pane { display: none; flex: 1; overflow: hidden; flex-direction: column; padding: 20px; gap: 14px; }
    .pane.active { display: flex; }

    /* ── Generic controls ─────────────────────────────────── */
    textarea {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 13px;
      padding: 10px 12px;
      resize: vertical;
      width: 100%;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    .row { display: flex; gap: 10px; align-items: flex-start; }
    .row textarea { flex: 1; }

    button {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 18px;
      white-space: nowrap;
      transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button.danger { background: var(--red); }
    button.success { background: var(--green); color: #000; }
    button.neutral { background: var(--border); color: var(--ink); }

    /* ── Output box ───────────────────────────────────────── */
    .output {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      flex: 1;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.6;
      overflow-y: auto;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 120px;
    }
    .output .placeholder { color: var(--muted); font-style: italic; }
    .output .err { color: var(--red); }
    .output .ok  { color: var(--green); }
    .output .dim { color: var(--muted); }

    /* ── Status badge ─────────────────────────────────────── */
    .badge {
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .4px;
      padding: 2px 7px;
      text-transform: uppercase;
    }
    .badge.running  { background: var(--accent-dim); color: var(--accent); }
    .badge.done     { background: var(--green-dim);  color: var(--green); }
    .badge.failed   { background: var(--red-dim);    color: var(--red); }
    .badge.pending  { background: var(--yellow-dim); color: var(--yellow); }
    .badge.waiting  { background: var(--border);     color: var(--muted); }

    /* ── Sessions phase bar ───────────────────────────────── */
    .phase-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .phase-pill {
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 12px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .phase-pill.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
    .phase-pill.done   { background: var(--green-dim);  border-color: var(--green);  color: var(--green); }

    /* ── Chat messages ────────────────────────────────────── */
    .chat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 140px;
    }
    .msg { display: flex; flex-direction: column; gap: 2px; }
    .msg .who { font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; }
    .msg.user .who { color: var(--accent); }
    .msg.bob  .who { color: var(--green); }
    .msg .body { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .msg .placeholder { color: var(--muted); font-style: italic; font-size: 12.5px; }

    /* ── Workflow card ────────────────────────────────────── */
    .wf-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .wf-card .wf-header { display: flex; align-items: center; gap: 10px; }
    .wf-card .wf-id { color: var(--muted); font-size: 11px; font-family: var(--mono); }
    .wf-card .wf-prompt { font-size: 12.5px; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
    .wf-card .wf-actions { display: flex; gap: 8px; }

    /* ── Section label ────────────────────────────────────── */
    .label { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; }

    hr { border: none; border-top: 1px solid var(--border); }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────── -->
<header>
  <h1>Bob<span>server</span> Demo</h1>
  <div class="server-row">
    <label class="label">API</label>
    <input id="base-url" type="text" value="http://localhost:8081" placeholder="http://localhost:8081" />
    <div id="status-dot" title="Health"></div>
  </div>
</header>

<!-- ── Auth bar ────────────────────────────────────────────────── -->
<div class="auth-bar">
  <label>Basic Auth</label>
  <input id="auth-user" type="text"     value="admin"  placeholder="username" />
  <input id="auth-pass" type="password" value="nowibm" placeholder="password" />
  <button class="neutral" onclick="checkHealth()" style="padding:4px 12px;font-size:12px;">Ping</button>
</div>

<!-- ── Tabs ────────────────────────────────────────────────────── -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('bob')">⚡ Bob Runs</button>
  <button class="tab"        onclick="switchTab('session')">🗺 Bob+ Sessions</button>
  <button class="tab"        onclick="switchTab('workflow')">🔁 Workflows</button>
</div>

<main>

  <!-- ═══════════════════════════════════════════════════════════
       TAB 1 — Bob Runs
  ══════════════════════════════════════════════════════════════ -->
  <div class="pane active" id="pane-bob">
    <div class="row">
      <textarea id="bob-prompt" rows="4" placeholder="Type a prompt for Bob Shell…&#10;e.g. List the files in /workspace"></textarea>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button onclick="startBobJob()">▶ Run</button>
        <button class="danger" onclick="cancelBobJob()" id="btn-bob-cancel" disabled>✕ Cancel</button>
        <button class="neutral" onclick="clearBobOutput()">Clear</button>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;">
      <span class="label">Status</span>
      <span id="bob-badge" class="badge waiting">idle</span>
      <span id="bob-job-id" style="font-family:var(--mono);font-size:11px;color:var(--muted)"></span>
    </div>

    <div class="output" id="bob-output"><span class="placeholder">Output will appear here…</span></div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       TAB 2 — Bob+ Sessions
  ══════════════════════════════════════════════════════════════ -->
  <div class="pane" id="pane-session">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <button onclick="createSession()">＋ New Session</button>
      <button class="neutral" onclick="loadCurrentSession()">↺ Load Current</button>
      <button class="danger" onclick="deleteSession()" id="btn-del-session" disabled>✕ Delete</button>
      <span id="session-id-label" style="font-family:var(--mono);font-size:11px;color:var(--muted)"></span>
    </div>

    <div class="phase-bar" id="phase-bar">
      <span class="phase-pill" data-phase="describe">1 · Describe</span>
      <span class="phase-pill" data-phase="discovery">2 · Discovery</span>
      <span class="phase-pill" data-phase="architecture">3 · Architecture</span>
      <span class="phase-pill" data-phase="spec">4 · Spec</span>
      <span class="phase-pill" data-phase="done">5 · Done</span>
    </div>

    <div class="chat" id="session-chat"><span class="placeholder">Start or load a session to begin…</span></div>

    <div class="row">
      <textarea id="session-msg" rows="2" placeholder="Type your message…"></textarea>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button onclick="sendSessionMessage()">Send</button>
        <button class="success" onclick="advancePhase()" id="btn-advance" disabled>→ Advance</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       TAB 3 — Workflows
  ══════════════════════════════════════════════════════════════ -->
  <div class="pane" id="pane-workflow">
    <div class="row">
      <textarea id="wf-prompt" rows="3" placeholder="Describe the workflow goal…&#10;e.g. Analyse /workspace/orders.csv and produce a regional summary"></textarea>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button onclick="createWorkflow()">▶ Create</button>
        <button class="neutral" onclick="listWorkflows()">↺ Refresh</button>
      </div>
    </div>

    <span class="label">Workflows</span>
    <div id="wf-list" style="display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;">
      <div style="color:var(--muted);font-size:12.5px;font-style:italic;">No workflows yet — create one above.</div>
    </div>

    <div class="output" id="wf-output" style="max-height:160px;"><span class="placeholder">Workflow plan / output will appear here…</span></div>
  </div>

</main>

<script>
// ── Helpers ────────────────────────────────────────────────────────────────

function base()   { return document.getElementById('base-url').value.replace(/\/$/, ''); }
function authHdr() {
  const u = document.getElementById('auth-user').value;
  const p = document.getElementById('auth-pass').value;
  return 'Basic ' + btoa(u + ':' + p);
}
function api(path, opts = {}) {
  return fetch(base() + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'Authorization': authHdr(), ...(opts.headers || {}) },
  });
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    const names = ['bob', 'session', 'workflow'];
    t.classList.toggle('active', names[i] === name);
  });
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.getElementById('pane-' + name).classList.add('active');
}

// ── Health ─────────────────────────────────────────────────────────────────

async function checkHealth() {
  const dot = document.getElementById('status-dot');
  try {
    const r = await fetch(base() + '/healthz');
    dot.className = r.ok ? 'ok' : 'err';
  } catch { dot.className = 'err'; }
}
checkHealth();
setInterval(checkHealth, 15000);

// ══════════════════════════════════════════════════════════════════════════
// TAB 1 — Bob Runs
// ══════════════════════════════════════════════════════════════════════════

let bobJobId   = null;
let bobPoller  = null;
let bobOffset  = 0;

function setBobBadge(status) {
  const el = document.getElementById('bob-badge');
  el.textContent = status;
  el.className = 'badge ' + (
    status === 'running'   ? 'running' :
    status === 'done'      ? 'done'    :
    status === 'failed'    ? 'failed'  :
    status === 'cancelled' ? 'failed'  : 'waiting'
  );
}

function appendBobOutput(text, cls = '') {
  const out = document.getElementById('bob-output');
  const existing = out.querySelector('.placeholder');
  if (existing) existing.remove();
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text;
  out.appendChild(span);
  out.scrollTop = out.scrollHeight;
}

function clearBobOutput() {
  document.getElementById('bob-output').innerHTML = '<span class="placeholder">Output will appear here…</span>';
  document.getElementById('bob-job-id').textContent = '';
  setBobBadge('idle');
  bobJobId = null; bobOffset = 0;
  clearInterval(bobPoller);
  document.getElementById('btn-bob-cancel').disabled = true;
}

async function startBobJob() {
  const prompt = document.getElementById('bob-prompt').value.trim();
  if (!prompt) return;
  clearBobOutput();
  setBobBadge('running');
  document.getElementById('btn-bob-cancel').disabled = false;

  try {
    const r = await api('/api/bob/jobs', {
      method: 'POST',
      body: JSON.stringify({ prompt, timeoutSeconds: 120, yolo: true }),
    });
    if (!r.ok) { appendBobOutput('Error: ' + (await r.text()), 'err'); setBobBadge('failed'); return; }
    const data = await r.json();
    bobJobId = data.id;
    bobOffset = 0;
    document.getElementById('bob-job-id').textContent = bobJobId;
    appendBobOutput('Job started: ' + bobJobId + '\n', 'dim');
    bobPoller = setInterval(pollBobJob, 1500);
  } catch(e) { appendBobOutput('Network error: ' + e.message, 'err'); setBobBadge('failed'); }
}

async function pollBobJob() {
  if (!bobJobId) return;
  try {
    const r = await api('/api/bob/jobs/' + bobJobId + '?offset=' + bobOffset);
    if (!r.ok) return;
    const data = await r.json();
    if (data.output) { appendBobOutput(data.output); bobOffset = data.nextOffset || bobOffset; }
    if (data.state !== 'running' && data.state !== 'starting') {
      clearInterval(bobPoller);
      setBobBadge(data.state);
      document.getElementById('btn-bob-cancel').disabled = true;
      if (data.state === 'done' || data.state === 'completed')
        appendBobOutput('\n✓ Completed\n', 'ok');
      else
        appendBobOutput('\n✗ ' + data.state + '\n', 'err');
    }
  } catch(e) { /* keep polling */ }
}

async function cancelBobJob() {
  if (!bobJobId) return;
  clearInterval(bobPoller);
  await api('/api/bob/jobs/' + bobJobId + '/cancel', { method: 'POST' });
  setBobBadge('cancelled');
  appendBobOutput('\n✗ Cancelled\n', 'err');
  document.getElementById('btn-bob-cancel').disabled = true;
}

// ══════════════════════════════════════════════════════════════════════════
// TAB 2 — Bob+ Sessions
// ══════════════════════════════════════════════════════════════════════════

let sessionId = null;
const PHASES = ['describe', 'discovery', 'architecture', 'spec', 'done'];

function updatePhaseBar(currentPhase) {
  const idx = PHASES.indexOf(currentPhase);
  document.querySelectorAll('.phase-pill').forEach((pill, i) => {
    pill.className = 'phase-pill' + (i < idx ? ' done' : i === idx ? ' active' : '');
  });
}

function addChatMsg(who, text) {
  const chat = document.getElementById('session-chat');
  const existing = chat.querySelector('.placeholder');
  if (existing) existing.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.innerHTML = `<span class="who">${who === 'user' ? 'You' : 'Bob'}</span><span class="body">${escHtml(text)}</span>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderSession(data) {
  sessionId = data.sessionId || data.id;
  document.getElementById('session-id-label').textContent = sessionId;
  document.getElementById('btn-del-session').disabled = false;
  document.getElementById('btn-advance').disabled = data.phase === 'done';
  updatePhaseBar(data.phase);
  // render message history
  const chat = document.getElementById('session-chat');
  chat.innerHTML = '';
  (data.messages || []).forEach(m => addChatMsg(m.role === 'user' ? 'user' : 'bob', m.content));
  if (!data.messages || data.messages.length === 0)
    chat.innerHTML = '<span class="placeholder">Session created — send your first message.</span>';
}

async function createSession() {
  try {
    const r = await api('/api/sessions', { method: 'POST', body: JSON.stringify({ title: '' }) });
    if (!r.ok) { alert('Error: ' + await r.text()); return; }
    renderSession(await r.json());
  } catch(e) { alert('Network error: ' + e.message); }
}

async function loadCurrentSession() {
  try {
    const r = await api('/api/sessions/current');
    if (r.status === 404) { alert('No active session. Create one first.'); return; }
    if (!r.ok) { alert('Error: ' + await r.text()); return; }
    renderSession(await r.json());
  } catch(e) { alert('Network error: ' + e.message); }
}

async function deleteSession() {
  if (!sessionId || !confirm('Delete session ' + sessionId + '?')) return;
  await api('/api/sessions/' + sessionId, { method: 'DELETE' });
  sessionId = null;
  document.getElementById('session-id-label').textContent = '';
  document.getElementById('btn-del-session').disabled = true;
  document.getElementById('btn-advance').disabled = true;
  document.getElementById('session-chat').innerHTML = '<span class="placeholder">Session deleted.</span>';
  updatePhaseBar('');
}

async function sendSessionMessage() {
  if (!sessionId) { alert('Create or load a session first.'); return; }
  const msg = document.getElementById('session-msg').value.trim();
  if (!msg) return;
  document.getElementById('session-msg').value = '';
  addChatMsg('user', msg);
  try {
    const r = await api('/api/sessions/' + sessionId + '/message', {
      method: 'POST',
      body: JSON.stringify({ message: msg }),
    });
    if (!r.ok) { addChatMsg('bob', 'Error: ' + await r.text()); return; }
    const data = await r.json();
    // API returns { message: { role, content, timestamp }, phaseId, transition, ... }
    const reply = data.message?.content || data.reply || JSON.stringify(data);
    addChatMsg('bob', reply);
    const phase = data.phaseId || data.phase;
    if (phase) updatePhaseBar(phase);
    document.getElementById('btn-advance').disabled = phase === 'done';
  } catch(e) { addChatMsg('bob', 'Network error: ' + e.message); }
}

async function advancePhase() {
  if (!sessionId) return;
  try {
    const r = await api('/api/sessions/' + sessionId + '/advance', { method: 'POST' });
    if (!r.ok) { alert('Error: ' + await r.text()); return; }
    const data = await r.json();
    // advance returns session dict with current phase
    const phase = data.currentPhase || data.phaseId || data.phase;
    if (phase) { updatePhaseBar(phase); addChatMsg('bob', '→ Advanced to phase: ' + phase); }
    if (data.openingMessage?.content) addChatMsg('bob', data.openingMessage.content);
    document.getElementById('btn-advance').disabled = phase === 'done';
  } catch(e) { alert('Network error: ' + e.message); }
}

// ══════════════════════════════════════════════════════════════════════════
// TAB 3 — Workflows
// ══════════════════════════════════════════════════════════════════════════

async function createWorkflow() {
  const objective = document.getElementById('wf-prompt').value.trim();
  if (!objective) return;
  try {
    const r = await api('/api/workflows', { method: 'POST', body: JSON.stringify({ objective }) });
    if (!r.ok) { setWfOutput('Error: ' + await r.text(), 'err'); return; }
    const data = await r.json();
    setWfOutput('Workflow created: ' + data.workflowId + '\nState: ' + data.state, 'ok');
    listWorkflows();
  } catch(e) { setWfOutput('Network error: ' + e.message, 'err'); }
}

async function listWorkflows() {
  try {
    const r = await api('/api/workflows');
    if (!r.ok) return;
    const list = await r.json();
    const container = document.getElementById('wf-list');
    if (!list.length) {
      container.innerHTML = '<div style="color:var(--muted);font-size:12.5px;font-style:italic;">No workflows yet — create one above.</div>';
      return;
    }
    container.innerHTML = '';
    list.forEach(wf => container.appendChild(buildWfCard(wf)));
  } catch(e) { /* silently fail */ }
}

function buildWfCard(wf) {
  const card = document.createElement('div');
  card.className = 'wf-card';
  card.id = 'wf-' + wf.workflowId;
  const statusCls = wf.status === 'running' ? 'running' : wf.status === 'done' ? 'done' : wf.status === 'failed' ? 'failed' : wf.status === 'pending_approval' ? 'pending' : 'waiting';
  const canApprove = wf.status === 'pending_approval';
  const canCancel  = ['running', 'pending_approval'].includes(wf.status);
  card.innerHTML = `
    <div class="wf-header">
      <span class="badge ${statusCls}">${wf.status}</span>
      <span class="wf-id">${wf.workflowId}</span>
    </div>
    <div class="wf-prompt">${escHtml((wf.prompt || '').substring(0, 200))}</div>
    <div class="wf-actions">
      ${canApprove ? `<button class="success" onclick="approveWorkflow('${wf.workflowId}')">✓ Approve</button>` : ''}
      ${canApprove ? `<button class="danger"  onclick="rejectWorkflow('${wf.workflowId}')">✗ Reject</button>` : ''}
      ${canCancel  ? `<button class="neutral" onclick="cancelWorkflow('${wf.workflowId}')">⏹ Cancel</button>` : ''}
      <button class="neutral" onclick="showWfPlan('${wf.workflowId}')">📄 Plan</button>
      <button class="danger"  onclick="deleteWorkflow('${wf.workflowId}')">🗑 Delete</button>
    </div>`;
  return card;
}

async function approveWorkflow(id) {
  const r = await api('/api/workflows/' + id + '/approve', { method: 'POST', body: JSON.stringify({ approved: true }) });
  setWfOutput(r.ok ? '✓ Approved — execution started.' : 'Error: ' + await r.text(), r.ok ? 'ok' : 'err');
  listWorkflows();
}

async function rejectWorkflow(id) {
  const r = await api('/api/workflows/' + id + '/approve', { method: 'POST', body: JSON.stringify({ approved: false }) });
  setWfOutput(r.ok ? '✗ Rejected.' : 'Error: ' + await r.text(), r.ok ? '' : 'err');
  listWorkflows();
}

async function cancelWorkflow(id) {
  await api('/api/workflows/' + id + '/cancel', { method: 'POST' });
  listWorkflows();
}

async function deleteWorkflow(id) {
  if (!confirm('Delete workflow ' + id + '?')) return;
  await api('/api/workflows/' + id, { method: 'DELETE' });
  listWorkflows();
}

async function showWfPlan(id) {
  try {
    const r = await api('/api/workflows/' + id + '/artifacts/plan.md');
    setWfOutput(r.ok ? await r.text() : 'No plan artifact yet.');
  } catch(e) { setWfOutput('Error: ' + e.message, 'err'); }
}

function setWfOutput(text, cls = '') {
  const out = document.getElementById('wf-output');
  out.innerHTML = '';
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text;
  out.appendChild(span);
}

// auto-refresh workflow list when tab is visible
document.querySelectorAll('.tab')[2].addEventListener('click', listWorkflows);
</script>
</body>
</html>
