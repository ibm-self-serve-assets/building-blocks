apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: bobserver
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: bobserver
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: bobserver:latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bobserver
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"bobserver:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"bobserver\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bobserver
  template:
    metadata:
      labels:
        app: bobserver
    spec:
      containers:
        - name: bobserver
          image: bobserver:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 18443
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: BOBSERVER_CERT_DEMO_ENABLED
              value: "true"
            - name: CERT_DEMO_ROOT
              value: /workspace/cert-demo
            - name: REPO_CERT_DEMO
              value: /app/demo/cert-rotation
            - name: DEMO_APP_HOST
              value: 0.0.0.0
            - name: DEMO_APP_PORT
              value: "18443"
            - name: DEMO_MIN_VALID_DAYS
              value: "30"
            - name: VAULT_ADDR
              value: http://vault:8200
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-demo-token
                  key: VAULT_TOKEN
                  optional: true
            - name: BOBSERVER_ADMIN_USERNAME
              value: admin
            - name: BOBSERVER_ADMIN_PASSWORD
              value: nowibm
            - name: BOBSERVER_APPID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: bobserver-appid
                  key: BOBSERVER_APPID_CLIENT_ID
                  optional: true
            - name: BOBSERVER_APPID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bobserver-appid
                  key: BOBSERVER_APPID_CLIENT_SECRET
                  optional: true
            - name: BOBSERVER_APPID_DISCOVERY_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: bobserver-appid
                  key: BOBSERVER_APPID_DISCOVERY_ENDPOINT
                  optional: true
            - name: BOBSERVER_APPID_REDIRECT_URI
              value: https://bobserver-binb.buildingblock-us-east-1-2bef1f4b4097001da9502000c44fc2b2-0000.us-east.containers.appdomain.cloud/auth/appid/callback
            - name: BOBSERVER_APPID_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: bobserver-appid
                  key: BOBSERVER_APPID_SESSION_SECRET
                  optional: true
            - name: BOBSERVER_WORKSPACE_ROOT
              value: /workspace
            - name: BOBSERVER_EXECUTOR_COMMAND
              value: /app/scripts/run-pipeline.sh
            - name: BOBSERVER_EXECUTOR_TIMEOUT_SECONDS
              value: "900"
            - name: BOBSERVER_BOB_MAX_COINS
              value: "30"
            - name: BOBSHELL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bobserver-credentials
                  key: BOBSHELL_API_KEY
                  optional: true
            - name: SERVICENOW_INSTANCE_URL
              valueFrom:
                secretKeyRef:
                  name: bobserver-servicenow
                  key: SERVICENOW_INSTANCE_URL
                  optional: true
            - name: SERVICENOW_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bobserver-servicenow
                  key: SERVICENOW_USERNAME
                  optional: true
            - name: SERVICENOW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bobserver-servicenow
                  key: SERVICENOW_PASSWORD
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: bobserver
spec:
  selector:
    app: bobserver
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: cert-demo-https
      port: 18443
      targetPort: 18443
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: bobserver
spec:
  to:
    kind: Service
    name: bobserver
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: bobserver-cert-demo
spec:
  to:
    kind: Service
    name: bobserver
  port:
    targetPort: cert-demo-https
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
