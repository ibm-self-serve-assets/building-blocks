<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 830" width="2400" height="830" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#8d8d8d"/>
    </marker>
    <style>
      .title{font-size:56px;font-weight:700;fill:#161616}
      .subtitle{font-size:27px;fill:#525252}
      .estate{font-size:24px;fill:#525252}
      .estate-b{font-size:24px;font-weight:600;fill:#161616}
      .cp{font-size:36px;font-weight:700;fill:#ffffff}
      .card-title{font-size:34px;font-weight:700;fill:#161616}
      .card-verb{font-size:22px;font-weight:600;letter-spacing:1px}
      .card-body{font-size:24px;fill:#393939}
      .foot{font-size:24px;fill:#525252}
    </style>
  </defs>

  <rect width="2400" height="830" fill="#ffffff"/>

  <!-- Title -->
  <text x="80" y="90" class="title">AI Control Plane</text>
  <text x="80" y="136" class="subtitle">Continuous visibility and control across the full AI lifecycle</text>


  <!-- Control plane container -->
  <rect x="80" y="190" width="2240" height="496" rx="18" fill="#f3faf5" stroke="#198038" stroke-width="3"/>
  <path d="M80,208 a18,18 0 0 1 18,-18 h2204 a18,18 0 0 1 18,18 v58 h-2240 z" fill="#198038"/>
  <text x="1200" y="246" text-anchor="middle" class="cp">AI Control Plane</text>

  <!-- Card 1: Agent Ops -->
  <rect x="120" y="306" width="680" height="340" rx="14" fill="#ffffff" stroke="#0f62fe" stroke-width="2.5"/>
  <rect x="120" y="306" width="680" height="12" rx="6" fill="#0f62fe"/>
  <text x="152" y="380" class="card-title">Agent Ops</text>
  <text x="152" y="420" class="card-verb" fill="#0043ce">EVALUATE · OBSERVE · ENFORCE</text>
  <text x="152" y="480" class="card-body">Test and red-team agents before</text>
  <text x="152" y="516" class="card-body">deployment, track cost and latency</text>
  <text x="152" y="552" class="card-body">in production, and enforce policy</text>
  <text x="152" y="588" class="card-body">controls as configuration, not code.</text>

  <!-- Card 2: AI Cost Management -->
  <rect x="860" y="306" width="680" height="340" rx="14" fill="#ffffff" stroke="#007d79" stroke-width="2.5"/>
  <rect x="860" y="306" width="680" height="12" rx="6" fill="#007d79"/>
  <text x="892" y="380" class="card-title">AI Cost Management</text>
  <text x="892" y="420" class="card-verb" fill="#005d5d">TRACK · ALLOCATE · OPTIMIZE</text>
  <text x="892" y="480" class="card-body">See where AI spend goes, allocate it</text>
  <text x="892" y="516" class="card-body">by team or use case, and keep it</text>
  <text x="892" y="552" class="card-body">within budget.</text>

  <!-- Card 3: AI Compliance -->
  <rect x="1600" y="306" width="680" height="340" rx="14" fill="#ffffff" stroke="#6929c4" stroke-width="2.5"/>
  <rect x="1600" y="306" width="680" height="12" rx="6" fill="#6929c4"/>
  <text x="1632" y="380" class="card-title">AI Compliance</text>
  <text x="1632" y="420" class="card-verb" fill="#6929c4">POLICY · PROOF</text>
  <text x="1632" y="480" class="card-body">Map AI use cases to regulations,</text>
  <text x="1632" y="516" class="card-body">assess risk, and prove controls hold</text>
  <text x="1632" y="552" class="card-body">with continuous, automated evidence.</text>


  <!-- Footer -->
  <text x="1200" y="766" text-anchor="middle" class="foot">Powered by IBM watsonx Orchestrate and IBM watsonx.governance</text>
</svg>
