[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bobserver"
version = "0.1.0"
description = "Small HTTP service for defining and observing data pipeline tasks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "authlib>=1.4,<2.0",
  "cryptography>=44,<45",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "itsdangerous>=2.2,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
]

[project.scripts]
bobserver = "bobserver.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bobserver = []
