name: Sync Bob skills catalog

# Keeps explore-BBs/bb-catalog/skills/ in step with the skills that teams ship
# in this repo (*/bob-skills/*.zip and ibm-bob/skills/).
#
# - Pull requests touching skill sources: staleness gate only (fails if the
#   committed catalog no longer matches a fresh generation).
# - Pushes to main touching skill sources, daily cron, or manual dispatch:
#   regenerate, validate, commit the refreshed catalog, and post a summary
#   comment on the standing "Skills catalog activity" issue — GitHub emails
#   the assignee for every comment. Nothing is committed if validation fails.
#
# The bot commit uses [skip ci] and only touches explore-BBs/bb-catalog/,
# which is outside this workflow's own trigger paths — no workflow loops.

on:
  push:
    branches: [main]
    paths:
      - '**/bob-skills/**'
      - 'ibm-bob/skills/**'
  pull_request:
    paths:
      - '**/bob-skills/**'
      - 'ibm-bob/skills/**'
      - 'explore-BBs/bb-catalog/scripts/sync_skills.py'
      - 'explore-BBs/bb-catalog/scripts/overrides.yaml'
  schedule:
    - cron: '17 6 * * *'   # daily backstop
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Post a test comment on the activity issue (verifies the email chain)'
        type: boolean
        default: false

env:
  # GitHub username that gets assigned to the activity issue (and therefore
  # emailed on every skill change). REPLACE with the catalog owner's handle.
  NOTIFY_USER: 'shima-r-moghaddam'
  ISSUE_TITLE: 'Skills catalog activity'

concurrency:
  group: sync-bob-skills
  cancel-in-progress: false

jobs:
  staleness-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Skills catalog staleness gate
        run: python3 explore-BBs/bb-catalog/scripts/sync_skills.py --check

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml

      - name: Regenerate skills catalog
        run: python3 explore-BBs/bb-catalog/scripts/sync_skills.py

      - name: Validate catalog
        id: validate
        continue-on-error: true
        run: python3 explore-BBs/bb-catalog/scripts/validate_catalog.py 2>&1 | tee validation.log

      - name: Detect catalog changes
        id: diff
        run: |
          git add -N explore-BBs/bb-catalog/skills explore-BBs/bb-catalog/skills-inventory.md
          {
            echo 'files<<EOF'
            git diff --name-status -- explore-BBs/bb-catalog/skills explore-BBs/bb-catalog/skills-inventory.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if git diff --quiet -- explore-BBs/bb-catalog/skills explore-BBs/bb-catalog/skills-inventory.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed catalog
        id: commit
        if: steps.validate.outcome == 'success' && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explore-BBs/bb-catalog/skills explore-BBs/bb-catalog/skills-inventory.md
          git commit -m "chore: sync Bob skills catalog [skip ci]"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Notify on the activity issue
        if: steps.diff.outputs.changed == 'true' || steps.validate.outcome == 'failure' || inputs.test_notification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NUM=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" \
                --json number,title \
                --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")
          if [ -z "$NUM" ]; then
            URL=$(gh issue create --title "$ISSUE_TITLE" \
              --body "Automated log of Bob skills catalog changes. One comment per sync that changed something or needs attention. Subscribe to this issue to get emailed." )
            NUM="${URL##*/}"
            gh issue edit "$NUM" --add-assignee "$NOTIFY_USER" || \
              gh issue comment "$NUM" --body "Could not assign @$NOTIFY_USER — set NOTIFY_USER in sync-bob-skills.yml to a valid collaborator. @$NOTIFY_USER"
          fi

          if [ "${{ inputs.test_notification }}" = "true" ]; then
            {
              echo "## :bell: Test notification"
              echo
              echo "Manual test of the notification chain. If you are reading this in email at the intended address, the chain works:"
              echo "issue assignment → subscription → bot comment → GitHub email → your mail filter."
              echo
              echo "Catalog state at test time: $(grep -m1 '^\*\*' explore-BBs/bb-catalog/skills-inventory.md)"
            } > comment.md
            gh issue comment "$NUM" --body-file comment.md
            exit 0
          fi

          {
            if [ "${{ steps.validate.outcome }}" = "failure" ]; then
              echo "## :rotating_light: Attention — validation failed, catalog NOT updated"
              echo
              echo '```'
              tail -30 validation.log
              echo '```'
            else
              echo "## Skills catalog synced"
              echo
              echo "Trigger: \`${{ github.event_name }}\` — commit: ${{ steps.commit.outputs.sha || 'n/a' }}"
              echo
              echo '```'
              echo "${{ steps.diff.outputs.files }}"
              echo '```'
            fi
            echo
            echo "### Current attention items (from skills-inventory.md)"
            echo
            awk '/^## Divergent copies/,/^## Excluded/' explore-BBs/bb-catalog/skills-inventory.md | sed '$d'
            awk '/^## Scan errors/,0' explore-BBs/bb-catalog/skills-inventory.md
          } > comment.md

          gh issue comment "$NUM" --body-file comment.md

      - name: Fail the run if validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
