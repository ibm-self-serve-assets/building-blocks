version: "1.0"

# IBM Building Blocks — Skills domain mapping
# Each entry maps a skill folderName to its domain and the exact documentation URL.
# The Bob+ Assets extension reads this file to generate the README preview for each skill.
#
# Fields:
#   folderName  — must match the folder name inside skills.zip exactly
#   domain      — AI | Data | Automation
#   docsUrl     — full URL to the skill's documentation page

skills:

  # ─── AI / Agent Skills ────────────────────────────────────────────────────
  # Agents: enterprise-ready AI agents, orchestration, automation
  - folderName: agent
    domain: AI
    docsUrl: https://ibm-self-serve-assets.github.io/building-blocks-docs/ai-core/bob-skills-and-modes/

  # AI Control Plane: Real-Time Guardrails
  - folderName: real-time-guardrails
    domain: AI
    docsUrl: https://ibm-self-serve-assets.github.io/building-blocks-docs/ai-core/bob-skills-and-modes/

  # AI Control Plane: Agent Ops
  - folderName: agent-ops
    domain: AI
    docsUrl: https://ibm-self-serve-assets.github.io/building-blocks-docs/ai-core/bob-skills-and-modes/

  # AI Control Plane: Model Evaluation (build-time GenAI evals)
  - folderName: build-time-gen-ai-evals
    domain: AI
    docsUrl: https://ibm-self-serve-assets.github.io/building-blocks-docs/ai-core/bob-skills-and-modes/

  # ─── Data / Context ───────────────────────────────────────────────────────
  # Data-streaming: Confluent
  - folderName: data-streaming-confluent
    domain: Data
    docsUrl: https://ibm-self-serve-assets.github.io/building-blocks-docs/data-core/bob-skills-and-modes/

